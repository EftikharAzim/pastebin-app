<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Paste</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <script>
      function confirmDelete() {
        return confirm(
          "Are you sure you want to delete this paste? This action cannot be undone."
        );
      }

      function copyToClipboard() {
        const urlElement = document.getElementById("paste-url");
        navigator.clipboard
          .writeText(urlElement.href)
          .then(() => {
            const copyButton = document.getElementById("copy-button");
            copyButton.textContent = "Copied!";
            setTimeout(() => {
              copyButton.textContent = "Copy URL";
            }, 1500);
          })
          .catch(() => alert("Failed to copy URL!"));
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h1>Paste Content</h1>
      <div class="url-container">
        <span>URL:</span>
        <a
          id="paste-url"
          href="{{ url_for('show_paste', paste_id=paste.id, _external=True) }}"
        >
          {{ url_for('show_paste', paste_id=paste.id, _external=True) }}
        </a>
        <button
          id="copy-button"
          onclick="copyToClipboard()"
          class="copy-button"
        >
          Copy URL
        </button>
      </div>

      <textarea readonly class="paste-content">{{ paste.content }}</textarea>

      <form method="POST">
        <input type="hidden" name="delete" value="true" />
        <button type="submit" name="delete" onclick="return confirmDelete()">
          Delete Paste
        </button>
      </form>

      <div class="nav-links">
        <a href="{{ url_for('index') }}">Create New Paste</a>
      </div>
    </div>
  </body>
</html>
